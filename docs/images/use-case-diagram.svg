<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="openArrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#333333" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- Actor: Program Manager -->
  <g stroke="#333333" stroke-width="2" fill="none">
    <circle cx="70" cy="120" r="16"/>
    <line x1="70" y1="136" x2="70" y2="200"/>
    <line x1="35" y1="160" x2="105" y2="160"/>
    <line x1="70" y1="200" x2="40" y2="245"/>
    <line x1="70" y1="200" x2="100" y2="245"/>
  </g>
  <text x="70" y="270" text-anchor="middle" font-size="14" fill="#111111">Nonprofit Program</text>
  <text x="70" y="286" text-anchor="middle" font-size="14" fill="#111111">Manager</text>

  <!-- System boundary -->
  <rect x="190" y="30" width="540" height="400" rx="10" fill="none" stroke="#333333" stroke-width="2"/>
  <text x="460" y="55" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Grant Fit Assessment System</text>

  <!-- Primary use case -->
  <ellipse cx="460" cy="130" rx="130" ry="42" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="460" y="126" text-anchor="middle" font-size="15" fill="#111111">Assess Grant Fit</text>
  <text x="460" y="144" text-anchor="middle" font-size="11" fill="#555555">(EUC: grant-fit-assessment)</text>

  <!-- Included use case: Check Eligibility -->
  <ellipse cx="320" cy="290" rx="120" ry="42" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="320" y="286" text-anchor="middle" font-size="15" fill="#111111">Check Eligibility</text>
  <text x="320" y="304" text-anchor="middle" font-size="11" fill="#555555">(deterministic stages)</text>

  <!-- Included use case: Assess Mission Alignment -->
  <ellipse cx="600" cy="290" rx="130" ry="42" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="600" y="286" text-anchor="middle" font-size="15" fill="#111111">Assess Mission Alignment</text>
  <text x="600" y="304" text-anchor="middle" font-size="11" fill="#555555">(reasoned stage)</text>

  <!-- Extending use case: Evaluate Assessment -->
  <ellipse cx="460" cy="390" rx="130" ry="38" fill="#eef3fb" stroke="#333333" stroke-width="2"/>
  <text x="460" y="386" text-anchor="middle" font-size="15" fill="#111111">Evaluate Assessment</text>
  <text x="460" y="404" text-anchor="middle" font-size="11" fill="#555555">(evaluationPipeline)</text>

  <!-- Actor -> primary use case association -->
  <line x1="108" y1="180" x2="345" y2="140" stroke="#333333" stroke-width="1.6"/>

  <!-- include: Assess Grant Fit -> Check Eligibility -->
  <line x1="410" y1="165" x2="345" y2="252" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="345" y="210" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">&#171;include&#187;</text>

  <!-- include: Assess Grant Fit -> Assess Mission Alignment -->
  <line x1="510" y1="165" x2="575" y2="252" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="575" y="210" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">&#171;include&#187;</text>

  <!-- Assess Grant Fit -> Evaluate Assessment -->
  <line x1="460" y1="172" x2="460" y2="352" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openArrow)"/>
  <text x="500" y="270" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">&#171;include&#187;</text>
</svg>
