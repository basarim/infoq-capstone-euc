<svg viewBox="0 0 760 460" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="openArrow2" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto">
      <path d="M0,0 L9,4 L0,8" fill="none" stroke="#333333" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- Actor: User -->
  <g stroke="#333333" stroke-width="2" fill="none">
    <circle cx="70" cy="120" r="16"/>
    <line x1="70" y1="136" x2="70" y2="200"/>
    <line x1="35" y1="160" x2="105" y2="160"/>
    <line x1="70" y1="200" x2="40" y2="245"/>
    <line x1="70" y1="200" x2="100" y2="245"/>
  </g>
  <text x="70" y="270" text-anchor="middle" font-size="14" fill="#111111">User</text>

  <!-- System boundary -->
  <rect x="190" y="30" width="540" height="400" rx="10" fill="none" stroke="#333333" stroke-width="2"/>
  <text x="460" y="55" text-anchor="middle" font-size="15" font-weight="bold" fill="#111111">Authentication System</text>

  <!-- Primary use case -->
  <ellipse cx="460" cy="130" rx="110" ry="40" fill="#ffffff" stroke="#333333" stroke-width="2"/>
  <text x="460" y="135" text-anchor="middle" font-size="15" fill="#111111">Log In</text>

  <!-- Included use case: Validate Credentials -->
  <ellipse cx="300" cy="290" rx="120" ry="40" fill="#f5f5f5" stroke="#333333" stroke-width="2"/>
  <text x="300" y="295" text-anchor="middle" font-size="15" fill="#111111">Validate Credentials</text>

  <!-- Extending use case: Reset Password -->
  <ellipse cx="600" cy="290" rx="115" ry="40" fill="#fdf3e3" stroke="#333333" stroke-width="2"/>
  <text x="600" y="295" text-anchor="middle" font-size="15" fill="#111111">Reset Password</text>

  <!-- Extending use case: Lock Account -->
  <ellipse cx="460" cy="390" rx="130" ry="36" fill="#fdf3e3" stroke="#333333" stroke-width="2"/>
  <text x="460" y="386" text-anchor="middle" font-size="15" fill="#111111">Lock Account</text>
  <text x="460" y="404" text-anchor="middle" font-size="11" fill="#555555">(after N failed attempts)</text>

  <!-- Actor -> Log In association -->
  <line x1="108" y1="180" x2="380" y2="150" stroke="#333333" stroke-width="1.6"/>

  <!-- include: Log In -> Validate Credentials (arrow points AT the included use case) -->
  <line x1="415" y1="165" x2="345" y2="255" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openArrow2)"/>
  <text x="345" y="215" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">&#171;include&#187;</text>

  <!-- extend: Reset Password -> Log In (arrow points AT the base use case, reversed direction) -->
  <line x1="575" y1="255" x2="505" y2="165" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openArrow2)"/>
  <text x="575" y="215" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">&#171;extend&#187;</text>

  <!-- extend: Lock Account -> Log In (arrow points AT the base use case) -->
  <line x1="460" y1="354" x2="460" y2="172" stroke="#333333" stroke-width="1.4" stroke-dasharray="6,4" marker-end="url(#openArrow2)"/>
  <text x="500" y="270" text-anchor="middle" font-size="12" font-style="italic" fill="#333333">&#171;extend&#187;</text>
</svg>
