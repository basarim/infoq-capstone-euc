<svg viewBox="0 0 1320 730" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6b8fd6"/>
    </marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#d99a6c"/>
    </marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#7aa87a"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94a3b8"/>
    </marker>
    <marker id="triOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#c2410c"/>
    </marker>
  </defs>

  <text x="40" y="30" font-size="19" font-weight="bold" fill="#1e293b">Business Intent &#8594; EUC &#8594; Execution + Evaluation &#8594; Across the SDLC</text>

  <!-- Business Intent -->
  <rect x="40" y="175" width="190" height="118" rx="8" fill="#e8eefc" stroke="#6b8fd6" stroke-width="1.5"/>
  <text x="135" y="228" text-anchor="middle" font-size="15" fill="#111111">Business Intent</text>
  <text x="135" y="248" text-anchor="middle" font-size="11" fill="#64748b">Goals, rules, constraints,</text>
  <text x="135" y="262" text-anchor="middle" font-size="11" fill="#64748b">expected outcomes</text>

  <!-- EUC group -->
  <rect x="300" y="95" width="300" height="278" rx="10" fill="#f2f8f1" stroke="#7aa87a" stroke-width="1.5"/>
  <rect x="312" y="82" width="230" height="22" rx="5" fill="#d9ead8"/>
  <text x="327" y="97" font-size="12" font-weight="bold" fill="#1c4527">Executable Use Case (EUC)</text>
  <rect x="325" y="160" width="250" height="186" rx="6" fill="#ffffff" stroke="#7aa87a" stroke-width="1.5"/>
  <text x="450" y="182" text-anchor="middle" font-size="13" font-weight="bold" fill="#111111">Machine-readable artifact</text>
  <text x="340" y="204" font-size="12" fill="#333333">&#8226; actor, goal</text>
  <text x="340" y="224" font-size="12" fill="#333333">&#8226; rules (deterministic)</text>
  <text x="340" y="244" font-size="12" fill="#333333">&#8226; policies</text>
  <text x="340" y="264" font-size="12" fill="#333333">&#8226; expectedOutcomes</text>
  <text x="340" y="284" font-size="12" fill="#333333">&#8226; evaluation criteria</text>

  <!-- Execution group -->
  <rect x="680" y="55" width="320" height="168" rx="10" fill="#f4f8ff" stroke="#6b8fd6" stroke-width="1.5"/>
  <rect x="692" y="42" width="90" height="22" rx="5" fill="#dbe7fb"/>
  <text x="706" y="57" font-size="12" font-weight="bold" fill="#1e3a6e">Execution</text>
  <rect x="705" y="113" width="270" height="86" rx="6" fill="#ffffff" stroke="#6b8fd6" stroke-width="1.5"/>
  <text x="840" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Runtime</text>
  <text x="840" y="170" text-anchor="middle" font-size="11" fill="#64748b">Deterministic rules + retrieval + LLM reasoning</text>

  <!-- Evaluation group -->
  <rect x="680" y="255" width="320" height="168" rx="10" fill="#fdf6f1" stroke="#d99a6c" stroke-width="1.5"/>
  <rect x="692" y="242" width="95" height="22" rx="5" fill="#f8e3d5"/>
  <text x="706" y="257" font-size="12" font-weight="bold" fill="#7c3e12">Evaluation</text>
  <rect x="705" y="313" width="270" height="86" rx="6" fill="#ffffff" stroke="#d99a6c" stroke-width="1.5"/>
  <text x="840" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Evaluation Harness</text>
  <text x="840" y="370" text-anchor="middle" font-size="11" fill="#64748b">Deterministic evals + AI judge</text>

  <!-- Execution Result -->
  <rect x="1080" y="113" width="210" height="86" rx="6" fill="#eef3fd" stroke="#6b8fd6" stroke-width="1.5"/>
  <text x="1185" y="150" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Execution Result</text>
  <text x="1185" y="170" text-anchor="middle" font-size="11" fill="#64748b">Classification + evidence</text>

  <!-- Evaluation Result -->
  <rect x="1080" y="313" width="210" height="86" rx="6" fill="#fbf0e7" stroke="#d99a6c" stroke-width="1.5"/>
  <text x="1185" y="350" text-anchor="middle" font-size="14" font-weight="bold" fill="#111111">Evaluation Result</text>
  <text x="1185" y="370" text-anchor="middle" font-size="11" fill="#64748b">Traceable to intent</text>

  <!-- Arrows: main flow -->
  <path d="M230,234 L265,234 L265,253 L325,253" fill="none" stroke="#6b8fd6" stroke-width="1.3" marker-end="url(#arrowBlue)"/>
  <text x="280" y="220" text-anchor="middle" font-size="11" fill="#4a6bb0">formalized into</text>

  <path d="M575,248 L650,248 L650,156 L705,156" fill="none" stroke="#6b8fd6" stroke-width="1.3" marker-end="url(#arrowBlue)"/>
  <text x="628" y="146" text-anchor="middle" font-size="11" fill="#4a6bb0">drives</text>

  <path d="M575,260 L650,260 L650,356 L705,356" fill="none" stroke="#d99a6c" stroke-width="1.3" marker-end="url(#arrowOrange)"/>
  <text x="650" y="322" text-anchor="middle" font-size="11" fill="#b5793f">defines criteria</text>

  <path d="M975,156 L1080,156" fill="none" stroke="#6b8fd6" stroke-width="1.3" marker-end="url(#arrowBlue)"/>
  <text x="1027" y="146" text-anchor="middle" font-size="11" fill="#4a6bb0">produces</text>

  <path d="M1185,199 L1185,240 L1040,240 L1040,356 L975,356" fill="none" stroke="#d99a6c" stroke-width="1.3" marker-end="url(#arrowOrange)"/>
  <text x="1055" y="290" text-anchor="middle" font-size="11" fill="#b5793f">assessed by</text>

  <path d="M975,362 L1080,362" fill="none" stroke="#d99a6c" stroke-width="1.3" marker-end="url(#arrowOrange)"/>
  <text x="1027" y="352" text-anchor="middle" font-size="11" fill="#b5793f">yields</text>

  <path d="M1185,399 L1185,455 L135,455 L135,293" fill="none" stroke="#94a3b8" stroke-width="1.3" marker-end="url(#arrowGray)"/>
  <text x="660" y="447" text-anchor="middle" font-size="11" fill="#64748b">feedback: refine intent</text>

  <!-- EUC -> SDLC Requirements -->
  <path d="M450,346 L450,505 L150,505 L150,535" fill="none" stroke="#7aa87a" stroke-width="1.3" marker-end="url(#arrowGreen)"/>
  <text x="300" y="498" text-anchor="middle" font-size="11" fill="#4d7a4d">single source of truth</text>

  <!-- Divider -->
  <line x1="40" y1="435" x2="1290" y2="435" stroke="#fdba74" stroke-width="1"/>
  <text x="665" y="430" text-anchor="middle" font-size="12" fill="#c2711f">the same EUC artifact is consumed at every SDLC stage</text>

  <!-- SDLC group -->
  <rect x="40" y="475" width="1250" height="186" rx="10" fill="#fffbf5" stroke="#fdba74" stroke-width="1.5"/>
  <rect x="52" y="462" width="150" height="22" rx="5" fill="#ffedd5"/>
  <text x="66" y="477" font-size="12" font-weight="bold" fill="#7c2d12">EUC Across the SDLC</text>

  <!-- SDLC boxes -->
  <rect x="60" y="535" width="180" height="86" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.3"/>
  <text x="150" y="562" text-anchor="middle" font-size="13" fill="#111111">Requirements</text>
  <text x="150" y="580" text-anchor="middle" font-size="10" fill="#64748b">EUC defines intended</text>
  <text x="150" y="592" text-anchor="middle" font-size="10" fill="#64748b">behavior &amp; outcomes</text>

  <rect x="276" y="535" width="180" height="86" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.3"/>
  <text x="366" y="562" text-anchor="middle" font-size="13" fill="#111111">Architecture</text>
  <text x="366" y="580" text-anchor="middle" font-size="10" fill="#64748b">EUC marks deterministic vs.</text>
  <text x="366" y="592" text-anchor="middle" font-size="10" fill="#64748b">probabilistic boundaries</text>

  <rect x="492" y="535" width="180" height="86" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.3"/>
  <text x="582" y="562" text-anchor="middle" font-size="13" fill="#111111">Development</text>
  <text x="582" y="580" text-anchor="middle" font-size="10" fill="#64748b">EUC guides rules,</text>
  <text x="582" y="592" text-anchor="middle" font-size="10" fill="#64748b">prompts &amp; context</text>

  <rect x="708" y="535" width="180" height="86" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="1.3"/>
  <text x="798" y="562" text-anchor="middle" font-size="13" fill="#111111">Runtime</text>
  <text x="798" y="580" text-anchor="middle" font-size="10" fill="#64748b">EUC supplies rules, policies</text>
  <text x="798" y="592" text-anchor="middle" font-size="10" fill="#64748b">&amp; expected behavior</text>

  <rect x="924" y="535" width="180" height="86" rx="6" fill="#ffffff" stroke="#86efac" stroke-width="1.3"/>
  <text x="1014" y="562" text-anchor="middle" font-size="13" fill="#111111">Evaluation</text>
  <text x="1014" y="580" text-anchor="middle" font-size="10" fill="#64748b">EUC supplies criteria</text>
  <text x="1014" y="592" text-anchor="middle" font-size="10" fill="#64748b">&amp; expected outcomes</text>

  <rect x="1140" y="535" width="130" height="86" rx="6" fill="#ffffff" stroke="#fdba74" stroke-width="1.3"/>
  <text x="1205" y="558" text-anchor="middle" font-size="13" fill="#111111">Regression</text>
  <text x="1205" y="576" text-anchor="middle" font-size="10" fill="#64748b">Unchanged EUC re-run</text>
  <text x="1205" y="588" text-anchor="middle" font-size="10" fill="#64748b">on model/prompt change</text>

  <!-- SDLC sequential arrows -->
  <line x1="240" y1="578" x2="276" y2="578" stroke="#c2410c" stroke-width="1.3" marker-end="url(#triOrange)"/>
  <line x1="456" y1="578" x2="492" y2="578" stroke="#c2410c" stroke-width="1.3" marker-end="url(#triOrange)"/>
  <line x1="672" y1="578" x2="708" y2="578" stroke="#c2410c" stroke-width="1.3" marker-end="url(#triOrange)"/>
  <line x1="888" y1="578" x2="924" y2="578" stroke="#c2410c" stroke-width="1.3" marker-end="url(#triOrange)"/>
  <line x1="1104" y1="578" x2="1140" y2="578" stroke="#c2410c" stroke-width="1.3" marker-end="url(#triOrange)"/>

  <text x="665" y="705" text-anchor="middle" font-size="13" fill="#64748b">Prompts, models, and retrieval can change &#8212; the EUC stays the same business contract across every SDLC stage.</text>
</svg>
